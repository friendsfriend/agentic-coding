// OTLP TraceService wire-compatible subset. Field numbers follow
// open-telemetry/opentelemetry-proto v1.9.0 trace/v1/trace.proto and common/v1/common.proto.
// Unknown fields remain protobuf-compatible; this receiver implements traces only.
syntax = "proto3";
package opentelemetry.proto.collector.trace.v1;
service TraceService {
  rpc Export(ExportTraceServiceRequest) returns (ExportTraceServiceResponse);
}
message ExportTraceServiceRequest { repeated ResourceSpans resourceSpans = 1; }
message ExportTraceServiceResponse { PartialSuccess partialSuccess = 1; }
message PartialSuccess { int64 rejectedSpans = 1; string errorMessage = 2; }
message ResourceSpans {
  Resource resource = 1;
  repeated ScopeSpans scopeSpans = 2;
  string schemaUrl = 3;
}
message Resource { repeated KeyValue attributes = 1; uint32 droppedAttributesCount = 2; }
message ScopeSpans { Scope scope = 1; repeated Span spans = 2; string schemaUrl = 3; }
message Scope {
  string name = 1; string version = 2;
  repeated KeyValue attributes = 3; uint32 droppedAttributesCount = 4;
}
message Span {
  bytes traceId = 1;
  bytes spanId = 2;
  string traceState = 3;
  bytes parentSpanId = 4;
  string name = 5;
  int32 kind = 6;
  fixed64 startTimeUnixNano = 7;
  fixed64 endTimeUnixNano = 8;
  repeated KeyValue attributes = 9;
  uint32 droppedAttributesCount = 10;
  repeated Event events = 11;
  uint32 droppedEventsCount = 12;
  uint32 droppedLinksCount = 14;
  Status status = 15;
  fixed32 flags = 16;
}
message Event {
  fixed64 timeUnixNano = 1; string name = 2;
  repeated KeyValue attributes = 3; uint32 droppedAttributesCount = 4;
}
message Status { reserved 1; string message = 2; int32 code = 3; }
message KeyValue { string key = 1; AnyValue value = 2; }
message AnyValue {
  oneof value {
    string stringValue = 1; bool boolValue = 2; int64 intValue = 3; double doubleValue = 4;
  }
}
