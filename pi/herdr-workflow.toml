[agents.presets.use-default-model]
runtime = "pi"

[workflow]
max_verification_rounds = 20
remote = "origin"
branch_prefix = "feature/"
base_branch = "origin/HEAD"

[wiki]
root = "~/.config/agentic-coding/wiki"

[projects]
root = "~/development"
max_depth = 3

[telemetry]
capture_content = false

[ui]
theme = "catppuccin"
selection_height = 10
