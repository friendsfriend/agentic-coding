[agents.profiles]

[agents.profiles.pi-opencode-go-deepseek-flash]
runtime = "pi"
model = "opencode-go/deepseek-v4-flash"
thinking = "high"

[agents.profiles.pi-opencode-go-deepseek-pro]
runtime = "pi"
model = "opencode-go/deepseek-v4-pro"
thinking = "high"

[agents.profiles.pi-opencode-go-luna]
runtime = "pi"
model = "opencode-go/gpt-5.6-luna"
thinking = "high"

[agents.profiles.pi-opencode-deepseek-flash-free]
runtime = "pi"
model = "opencode/deepseek-v4-flash-free"
thinking = "high"

[agents.profiles.pi-opencode-hy3-free]
runtime = "pi"
model = "opencode/hy3-free"
thinking = "high"

[workflow]
max_verification_rounds = 20
remote = "origin"
branch_prefix = "feature/"
base_branch = "origin/HEAD"

[projects]
root = "~/development"
max_depth = 3

[telemetry]
capture_content = false

[ui]
theme = "catppuccin"
selection_height = 10
