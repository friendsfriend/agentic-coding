[agents.presets.use-default-model]
runtime = "pi"

[workflow]
max_verification_rounds = 20
remote = "origin"
branch_prefix = "feature/"
base_branch = "origin/HEAD"

[wiki]
root = "~/.config/agentic-coding/wiki"

[projects]
root = "~/development"
max_depth = 3

[telemetry]
capture_content = false

[ui]
theme = "catppuccin"
selection_height = 10
# Opt-in native Herdr sidebar cards for managed workflows and agents
# (see docs/herdr-sidebar.md). User configuration only: a project overlay
# cannot change this server-wide choice.
herdr_sidebar = false
