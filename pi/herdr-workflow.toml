[models]
triage = "opencode-go/deepseek-v4-flash"
recovery = "opencode-go/deepseek-v4-flash"
planner = "opencode-go/deepseek-v4-flash"
worker_default = "opencode-go/deepseek-v4-flash"
worker_alternative = "eon/claude-5-sonnet"
verifier = "opencode-go/deepseek-v4-flash"
security_verifier = "opencode-go/deepseek-v4-flash"
quality_verifier = "opencode-go/deepseek-v4-flash"
performance_verifier = "opencode-go/deepseek-v4-flash"
test_verifier = "opencode-go/deepseek-v4-flash"
usability_verifier = "opencode-go/deepseek-v4-flash"
agents_verifier = "opencode-go/deepseek-v4-flash"
openspec_verifier = "opencode-go/deepseek-v4-flash"
verifier_fallback = "eon/claude-5-sonnet"
archive = "opencode-go/deepseek-v4-flash"

[thinking]
triage = "high"
recovery = "high"
verifier_lite = "high"
planner = "high"
worker_default = "high"
verifier = "high"
archive = "high"

[workflow]
max_verification_rounds = 6
remote = "origin"
branch_prefix = "feature/"
base_branch = "origin/HEAD"
worktree_directory = "~/.herdr/worktrees"

[projects]
root = "~/development"
max_depth = 3

[telemetry]
# Capture prompt/output/tool I/O in local traces.jsonl only. Never sent to OTLP.
capture_content = true

[ui]
theme = "catppuccin"
selection_height = 10
