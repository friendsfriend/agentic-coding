# Agentic Coding workflow configuration.

[agents]
 default_profile = "pi-planner"

 # ---- pi profiles (frontier planning, cheap everything-else) ----
 [agents.profiles.pi-planner]
 runtime = "pi"
 model = "opencode-go/ox-alpha-free"
 thinking = "high"

 [agents.profiles.pi-cheap]          # no-openspec default + fallback
 runtime = "pi"
 model = "opencode-go/ox-alpha-free"
 thinking = "high"

 [agents.profiles.pi-worker]
 runtime = "pi"
 model = "opencode-go/ox-alpha-free"
 thinking = "high"

 [agents.profiles.pi-review]
 runtime = "pi"
 model = "opencode-go/ox-alpha-free"
 thinking = "high"

 [agents.profiles.pi-review-min]    
 runtime = "pi"
 model = "opencode-go/ox-alpha-free"
 thinking = "high"

 [agents.profiles.pi-test-review]
 runtime = "pi"
 model = "opencode-go/ox-alpha-free"
 thinking = "high"

 [agents.profiles.pi-archive]
 runtime = "pi"
 model = "opencode-go/ox-alpha-free"
 thinking = "high"

 # ---- opencode profiles (worker + secondary verifiers) ----
 [agents.profiles.oc-worker]
 runtime = "opencode"
 model = "opencode-go/ox-alpha-free"
 agent = "build"

 [agents.profiles.oc-review]
 runtime = "opencode"
 model = "opencode-go/ox-alpha-free"
 agent = "build"

 [agents.profiles.oc-archive]
 runtime = "opencode"
 model = "opencode-go/ox-alpha-free"
 agent = "build"

 # ---- opencode-v2 profiles ----
 [agents.profiles.oc2-review]
 runtime = "opencode-v2"
 model = "opencode-go/ox-alpha-free"
 agent = "build"

 [agents.profiles.oc2-archive]
 runtime = "opencode-v2"
 model = "opencode-go/ox-alpha-free"
 agent = "build"

 # ---- step routing ----
 [agents.routes]
 "core.plan" = "pi-planner"            # strongest model, max thinking
 "core.implementation" = "pi-worker"   # opencode does the editing
 "core.triage" = "pi-review"
 "core.verification" = "pi-review"     # fallback when no role route
 "core.archive" = "pi-archive"

 # ---- per-role verification matrix ----
 [agents.role_routes."core.verification"]
 quality-verifier = "pi-review"        # pi · glm-5.3 · high
 security-verifier = "pi-review"       # opencode · gpt-5.4-mini
 performance-verifier = "pi-review"   # opencode-v2 · gpt-5.6-luna
 openspec-verifier = "pi-review-min"   # pi · flash · low
 usability-verifier = "pi-review"
 test-verifier = "pi-test-review"      # pi · flash · minimal

 # ---- per-definition defaults ----
 [agents.definition_defaults]
 "no-openspec" = "pi-cheap"

 # ---- require mixed runtimes across steps (fails config if violated) ----
 [[agents.runtime_diversity]]
 routes = ["core.plan", "core.implementation"]

# [agents.role_routes."core.verification"]
# security-verifier = "oc-review"
#
# [[agents.runtime_diversity]]
# steps = ["core.implementation", "core.verification"]

[workflow]
max_verification_rounds = 20
remote = "origin"
branch_prefix = "feature/"
base_branch = "origin/HEAD"

[projects]
root = "~/development"
max_depth = 3

[telemetry]
# Content stays local and bounded. OTLP export excludes content.
capture_content = false

[ui]
theme = "catppuccin"
selection_height = 10
