[agents]
default_profile = "pi-planner"

[agents.profiles.pi-planner]
runtime = "pi"
model = "opencode-go/ox-alpha-free"
thinking = "high"

[agents.profiles.pi-cheap]
runtime = "pi"
model = "opencode-go/ox-alpha-free"
thinking = "high"

[agents.profiles.pi-worker]
runtime = "pi"
model = "opencode-go/ox-alpha-free"
thinking = "high"

[agents.profiles.pi-review]
runtime = "pi"
model = "opencode-go/ox-alpha-free"
thinking = "high"

[agents.profiles.pi-review-min]
runtime = "pi"
model = "opencode-go/ox-alpha-free"
thinking = "high"

[agents.profiles.pi-test-review]
runtime = "pi"
model = "opencode-go/ox-alpha-free"
thinking = "high"

[agents.profiles.pi-archive]
runtime = "pi"
model = "opencode-go/ox-alpha-free"
thinking = "high"

[agents.profiles.oc-worker]
runtime = "opencode"
model = "opencode-go/ox-alpha-free"
agent = "build"

[agents.profiles.oc-review]
runtime = "opencode"
model = "opencode-go/ox-alpha-free"
agent = "build"

[agents.profiles.oc-archive]
runtime = "opencode"
model = "opencode-go/ox-alpha-free"
agent = "build"

[agents.profiles.oc2-review]
runtime = "opencode-v2"
model = "opencode-go/ox-alpha-free"
agent = "build"

[agents.profiles.oc2-archive]
runtime = "opencode-v2"
model = "opencode-go/ox-alpha-free"
agent = "build"

[agents.profiles.pi-ox-alpha-free]
runtime = "pi"
model = "opencode/x-preview-f-free"
thinking = "high"

[agents.profiles."pi-gpt-5.6-luna"]
runtime = "pi"
model = "github-copilot/gpt-5.6-luna"
thinking = "high"

[agents.profiles.pi-sonnet-5]
runtime = "pi"
model = "eon/claude-5-sonnet"
thinking = "high"

[agents.profiles.pi-opus-5]
runtime = "pi"
model = "eon/claude-4.8-opus"
thinking = "high"

[agents.routes]
"core.plan" = "pi-planner"
"core.implementation" = "pi-worker"
"core.triage" = "pi-review"
"core.verification" = "pi-review"
"core.archive" = "pi-archive"

[agents.role_routes."core.verification"]
quality-verifier = "pi-review"
security-verifier = "pi-review"
performance-verifier = "pi-review"
openspec-verifier = "pi-review-min"
usability-verifier = "pi-review"
test-verifier = "pi-test-review"

[agents.definition_defaults]
no-openspec = "pi-cheap"

[agents.presets.frontier-plan]
description = "Frontier planning, cheap workers"
default_profile = "pi-cheap"

[agents.presets.frontier-plan.steps]
"core.plan" = "pi-planner"
"core.implementation" = "oc-worker"

[agents.presets.frontier-plan.roles."core.verification"]
quality-verifier = "pi-review"

[agents.presets.cheap-luna]
default_profile = "pi-gpt-5.6-luna"

[agents.presets.cheap-luna.steps]
"core.plan" = "pi-gpt-5.6-luna"
"core.implementation" = "pi-gpt-5.6-luna"
"core.triage" = "pi-gpt-5.6-luna"
"core.archive" = "pi-gpt-5.6-luna"

[agents.presets.cheap-luna.roles."core.verification"]
quality-verifier = "pi-gpt-5.6-luna"
security-verifier = "pi-gpt-5.6-luna"
performance-verifier = "pi-gpt-5.6-luna"
openspec-verifier = "pi-gpt-5.6-luna"
usability-verifier = "pi-gpt-5.6-luna"
test-verifier = "pi-gpt-5.6-luna"

[agents.presets.free-ox-alpha]
default_profile = "pi-ox-alpha-free"

[agents.presets.free-ox-alpha.steps]
"core.plan" = "pi-ox-alpha-free"
"core.implementation" = "pi-ox-alpha-free"
"core.triage" = "pi-ox-alpha-free"
"core.archive" = "pi-ox-alpha-free"

[agents.presets.free-ox-alpha.roles."core.verification"]
quality-verifier = "pi-ox-alpha-free"
security-verifier = "pi-ox-alpha-free"
performance-verifier = "pi-ox-alpha-free"
openspec-verifier = "pi-ox-alpha-free"
usability-verifier = "pi-ox-alpha-free"
test-verifier = "pi-ox-alpha-free"

[agents.presets.effective-sonnet]
default_profile = "pi-sonnet-5"

[agents.presets.effective-sonnet.steps]
"core.plan" = "pi-sonnet-5"
"core.implementation" = "pi-sonnet-5"
"core.triage" = "pi-sonnet-5"
"core.archive" = "pi-sonnet-5"

[agents.presets.effective-sonnet.roles."core.verification"]
quality-verifier = "pi-sonnet-5"
security-verifier = "pi-sonnet-5"
performance-verifier = "pi-sonnet-5"
openspec-verifier = "pi-sonnet-5"
usability-verifier = "pi-sonnet-5"
test-verifier = "pi-sonnet-5"

[agents.presets.opus-planner-sonnet-worker]
default_profile = "pi-sonnet-5"

[agents.presets.opus-planner-sonnet-worker.steps]
"core.plan" = "pi-opus-5"
"core.implementation" = "pi-sonnet-5"
"core.triage" = "pi-sonnet-5"
"core.archive" = "pi-sonnet-5"

[agents.presets.opus-planner-sonnet-worker.roles."core.verification"]
quality-verifier = "pi-sonnet-5"
security-verifier = "pi-sonnet-5"
performance-verifier = "pi-sonnet-5"
openspec-verifier = "pi-sonnet-5"
usability-verifier = "pi-sonnet-5"
test-verifier = "pi-sonnet-5"

[agents.presets.opus-planner-sonnet-worker-luna-reviewer]
default_profile = "pi-gpt-5.6-luna"

[agents.presets.opus-planner-sonnet-worker-luna-reviewer.steps]
"core.plan" = "pi-opus-5"
"core.implementation" = "pi-sonnet-5"
"core.triage" = "pi-gpt-5.6-luna"
"core.archive" = "pi-gpt-5.6-luna"

[agents.presets.opus-planner-sonnet-worker-luna-reviewer.roles."core.verification"]
quality-verifier = "pi-gpt-5.6-luna"
security-verifier = "pi-gpt-5.6-luna"
performance-verifier = "pi-gpt-5.6-luna"
openspec-verifier = "pi-gpt-5.6-luna"
usability-verifier = "pi-gpt-5.6-luna"
test-verifier = "pi-gpt-5.6-luna"

[[agents.runtime_diversity]]
routes = ["core.plan", "core.implementation"]

[workflow]
max_verification_rounds = 20
remote = "origin"
branch_prefix = "feature/"
base_branch = "origin/HEAD"

[projects]
root = "~/development"
max_depth = 3

[telemetry]
capture_content = false

[ui]
theme = "catppuccin"
selection_height = 10
