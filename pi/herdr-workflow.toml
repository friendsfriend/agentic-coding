# Workflow configuration — installed to ~/.config/agentic-coding/config.toml.
# Models are intentionally not pinned: an unconfigured step uses the model pi
# selects by default. Add entries to pin per role, e.g.:
# [models]
# worker_default = "provider/model"
# planner = "provider/model"
# verifier = "provider/model"

[thinking]
triage = "high"
verifier_lite = "high"
planner = "high"
worker_default = "high"
verifier = "high"
archive = "high"

[workflow]
max_verification_rounds = 6
remote = "origin"
branch_prefix = "feature/"
base_branch = "origin/HEAD"
worktree_directory = "~/.herdr/worktrees"

[projects]
root = "~/development"
max_depth = 3

[telemetry]
# Capture prompt/output/tool I/O in local traces.jsonl only. Never sent to OTLP.
capture_content = true

[ui]
theme = "catppuccin"
selection_height = 10
